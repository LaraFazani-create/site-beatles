<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Beatles - Contato</title>
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Work+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>The Beatles</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="sobre.html">Sobre</a>
      <div class="submenu">
        <a href="#">Integrantes &#9662;</a>
        <div class="submenu-itens">
          <a href="john.html">John Lennon</a>
          <a href="paul.html">Paul McCartney</a>

          <a href="ringo.html">Ringo Starr</a>
        </div>
      </div>
      <a href="contato.html" class="ativo">Contato</a>
    </nav>
  </header>

  <main>
    <h2>Contato</h2>
    <p>Preencha o formulário para falar com a gente.</p>

    <form id="formContato" onsubmit="return validarFormulario()" novalidate>

      <label for="nome">Nome</label>
      <input type="text" id="nome">
      <span class="erro" id="erro-nome"></span>

      <label for="email">E-mail</label>
      <input type="text" id="email">
      <span class="erro" id="erro-email"></span>

      <label for="telefone">Telefone</label>
      <input type="text" id="telefone" placeholder="Ex: 19999999999">
      <span class="erro" id="erro-telefone"></span>

      <label for="assunto">Assunto</label>
      <select id="assunto">
        <option value="">Selecione</option>
        <option value="duvida">Dúvida</option>
        <option value="sugestao">Sugestão</option>
        <option value="elogio">Elogio</option>
      </select>
      <span class="erro" id="erro-assunto"></span>

      <label for="mensagem">Mensagem</label>
      <textarea id="mensagem"></textarea>
      <span class="erro" id="erro-mensagem"></span>

      <button type="submit">Enviar</button>
      <p id="sucesso"></p>
    </form>
  </main>

  <footer>
    <p>Desenvolvido por Lara Fazani Ribeiro</p>
  </footer>

  <script src="js/validacao.js"></script>
</body>
</html>
